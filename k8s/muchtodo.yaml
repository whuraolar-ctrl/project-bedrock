apiVersion: apps/v1
kind: Deployment
metadata:
  name: muchtodo
  labels:
    app: muchtodo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: muchtodo
  template:
    metadata:
      labels:
        app: muchtodo
    spec:
      containers:
        - name: muchtodo
          image: 233096559135.dkr.ecr.us-east-1.amazonaws.com/muchtodo:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP

          env:
            - name: PORT
              value: "8080"

            - name: ENABLE_CACHE
              value: "false"

            - name: JWT_EXPIRATION_HOURS
              value: "72"

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: muchtodo-secret
                  key: MONGO_URI

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: muchtodo-secret
                  key: DB_NAME

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: muchtodo-secret
                  key: JWT_SECRET_KEY

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: muchtodo
  labels:
    app: muchtodo
spec:
  type: LoadBalancer
  selector:
    app: muchtodo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
